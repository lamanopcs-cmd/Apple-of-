<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Apple of Fortune - 10x5 Official</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{--bg:#0a1120;--card:#121f36;--line:#1d3559;--green:#00e676;--gold:#ffd54f;--red:#ff3d6e;--blue:#009dff}
body{background:var(--bg);color:#fff;display:flex;justify-content:center;padding:10px;min-height:100vh}
.wrap{width:100%;max-width:420px}
.header{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.header h1{font-size:14px;font-weight:900;letter-spacing:.5px}
.header h1 span{color:var(--gold)}
.bal{text-align:right}
.bal small{font-size:9px;color:#6a84a8;display:block}
.bal b{color:var(--gold);font-size:16px}
.main{background:linear-gradient(180deg,#132040,#0d1529);border:1px solid var(--line);border-radius:16px;padding:14px}
.odds-box{text-align:center;margin-bottom:10px}
.odds-box .lbl{font-size:9px;letter-spacing:2px;color:#6a84a8}
.odds-box .val{font-size:34px;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(255,213,79,.4)}
.info{text-align:center;font-size:12px;font-weight:700;min-height:18px;margin-bottom:10px;color:#8aa1c2}
.info.win{color:var(--green)} .info.lose{color:var(--red)}

.ladder{display:flex;flex-direction:column-reverse;gap:6px}
.lvl-row{display:flex;align-items:center;gap:8px;transition:all .3s}
.lvl-row.locked{opacity:.3;pointer-events:none;filter:grayscale(.5)}
.lvl-row.done{opacity:.6}
.lvl-row.active .mult{background:var(--gold);color:#000;box-shadow:0 0 12px var(--gold)}
.mult{min-width:56px;font-size:11px;font-weight:900;background:#0e1d36;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;color:#5d7da8}
.cells{display:flex;gap:6px;flex:1}
.cell{flex:1;aspect-ratio:1/0.9;background:linear-gradient(180deg,#1b2f54,#13233f);border:1px solid #25406d;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;position:relative;transition:.2s}
.cell:hover{border-color:var(--blue);transform:translateY(-2px)}
.cell.revealed-good{background:linear-gradient(180deg,#0f3d1f,#0a2a15);border-color:var(--green);box-shadow:0 0 18px rgba(0,230,118,.5)}
.cell.revealed-bad{background:linear-gradient(180deg,#4a1525,#2a0e18);border-color:var(--red);box-shadow:0 0 18px rgba(255,61,110,.5);animation:shake .3s}
.cell.blocked{opacity:.25;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.controls{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px;border-radius:12px;border:none;font-weight:900;font-size:13px;cursor:pointer}
.btn-cash{background:linear-gradient(135deg,#00c853,var(--green));color:#00210a}
.btn-reset{background:#1a2d4e;color:#8aa1c2;border:1px solid var(--line)}
.btn:disabled{opacity:.35}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🍎 APPLE OF <span>FORTUNE</span><br><small style="font-size:9px;color:#4a658a;letter-spacing:2px">10x5 OFFICIAL</small></h1>
    <div class="bal"><small>SOLDE</small><b id="balance">10 000</b></div>
  </div>
  <div class="main">
    <div class="odds-box"><div class="lbl">COTE ACTUELLE</div><div class="val" id="odds">x1.20</div></div>
    <div class="info" id="status">Étage 1 - Choisis une pomme</div>
    <div class="ladder" id="ladder"></div>
    <div class="controls">
      <button class="btn btn-reset" id="btnReset">🔄 RESET</button>
      <button class="btn btn-cash" id="btnCash">ENCAISSER</button>
    </div>
  </div>
</div>

<script>
const ODDS = [1.20, 1.44, 1.73, 2.08, 2.50, 3.00, 3.60, 4.32, 5.19, 6.23];
const ROWS = 10, COLS = 5;
let balance = 10000, bet = 1000, currentLevel = 0, traps = [], isPlaying = true;

const ladder = document.getElementById('ladder');
const balanceEl = document.getElementById('balance');
const oddsEl = document.getElementById('odds');
const statusEl = document.getElementById('status');
const cashBtn = document.getElementById('btnCash');

function buildGame(){
  ladder.innerHTML=''; traps = Array.from({length:ROWS},()=>Math.floor(Math.random()*COLS));
  currentLevel=0; isPlaying=true;
  balance-=bet; if(balance<0) balance=10000;
  for(let r=0;r<ROWS;r++){
    const row=document.createElement('div');
    row.className='lvl-row'+(r===0?' active':' locked');
    row.dataset.r=r;
    row.innerHTML=`<div class="mult">x${ODDS[r].toFixed(2)}</div><div class="cells"></div>`;
    const cellsContainer=row.querySelector('.cells');
    for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');
      cell.className='cell'; cell.textContent='🍎'; cell.dataset.c=c;
      cell.onclick=()=>clickCell(r,c,cell,row);
      cellsContainer.appendChild(cell);
    }
    ladder.appendChild(row);
  }
  updateUI();
  statusEl.textContent='Étage 1 - Choisis une pomme'; statusEl.className='info';
}

function clickCell(r,c,cellEl,rowEl){
  if(!isPlaying || r!==currentLevel) return;
  const isTrap = c===traps[r];
  cellEl.classList.add(isTrap?'revealed-bad':'revealed-good');
  cellEl.textContent=isTrap?'💥':'🍏';
  rowEl.querySelectorAll('.cell').forEach(other=>{ if(other!==cellEl) other.classList.add('blocked'); });

  if(isTrap){
    statusEl.textContent=`💥 Perdu à l'étage ${r+1}!`; statusEl.className='info lose';
    isPlaying=false; revealBombs(); cashBtn.disabled=true;
  }else{
    currentLevel++;
    rowEl.classList.remove('active'); rowEl.classList.add('done');
    if(currentLevel>=ROWS){
      const win=Math.floor(bet*ODDS[ROWS-1]); balance+=win;
      statusEl.textContent=`🎉 JACKPOT! 10/10 étages! +${win.toLocaleString('fr-FR')}`; statusEl.className='info win';
      isPlaying=false; cashBtn.textContent=`JACKPOT ${win}`; cashBtn.disabled=true;
    }else{
      const next=document.querySelector(`.lvl-row[data-r="${currentLevel}"]`);
      next.classList.remove('locked'); next.classList.add('active');
      statusEl.textContent=`✅ Étage ${r+1} OK! Va à l'étage ${currentLevel+1}`; statusEl.className='info win';
    }
  }
  updateUI();
}

function revealBombs(){
  document.querySelectorAll('.lvl-row').forEach((row,ri)=>{
    row.classList.remove('locked','active');
    row.querySelectorAll('.cell').forEach((cell,ci)=>{
      if(ci===traps[ri] && !cell.classList.contains('revealed-bad') && !cell.classList.contains('revealed-good')){
        cell.textContent='💣'; cell.style.opacity='.5';
      }
    });
  });
}

function updateUI(){
  balanceEl.textContent=balance.toLocaleString('fr-FR');
  if(currentLevel>0){
    const gain=Math.floor(bet*ODDS[currentLevel-1]);
    oddsEl.textContent='x'+ODDS[currentLevel-1].toFixed(2);
    cashBtn.textContent=`ENCAISSER ${gain.toLocaleString('fr-FR')}`; cashBtn.disabled=!isPlaying;
  }else{
    oddsEl.textContent='x1.20'; cashBtn.textContent='ENCAISSER'; cashBtn.disabled=true;
  }
}

cashBtn.onclick=()=>{
  if(!isPlaying || currentLevel===0) return;
  const gain=Math.floor(bet*ODDS[currentLevel-1]); balance+=gain;
  statusEl.textContent=`💰 Encaissé étage ${currentLevel}: +${gain.toLocaleString('fr-FR')}`; statusEl.className='info win';
  isPlaying=false; revealBombs(); updateUI(); cashBtn.textContent='ENCAISSÉ'; cashBtn.disabled=true;
};

document.getElementById('btnReset').onclick=buildGame;
buildGame();
</script>
</body>
</html>
