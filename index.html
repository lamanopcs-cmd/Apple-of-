<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Apple of Fortune — Prédicteur PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
:root{--bg:#0a0f1e;--card:#101828;--border:#1c2a44;--blue:#009dff;--green:#00e676;--gold:#ffd54f;--red:#ff3d6e;}
html,body{width:100%;min-height:100vh;background:var(--bg);color:#fff;overflow-x:hidden;}

.bgfx{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#0a0f1e,#0c1526 50%,#081020);}
.bgfx::before{content:'';position:absolute;inset:0;background:
 radial-gradient(ellipse 80% 45% at 50% -5%,rgba(0,157,255,.18),transparent),
 radial-gradient(ellipse 60% 40% at 85% 105%,rgba(255,213,79,.06),transparent);}
.bgfx::after{content:'';position:absolute;inset:0;opacity:.3;
 background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.04) 1px,transparent 0);background-size:22px 22px;}

.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:16px 16px 44px;}

.hdr{display:flex;align-items:center;gap:11px;margin-bottom:16px;}
.hdr .lg{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#0057b8,#009dff);
 display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 24px rgba(0,157,255,.4);}
.hdr .t{flex:1;}
.hdr h1{font-size:17px;font-weight:900;letter-spacing:-.3px;}
.hdr h1 span{color:var(--blue);}
.hdr .s{font-size:10px;color:#4d6078;letter-spacing:2px;margin-top:2px;}
.hdr .pct{background:linear-gradient(135deg,#00c853,#00e676);color:#00210a;font-size:10px;
 font-weight:900;padding:5px 10px;border-radius:20px;box-shadow:0 0 14px rgba(0,230,118,.4);}

.pred{background:linear-gradient(150deg,#0d1930,#0a1224);border:1px solid #1d4a7d;border-radius:16px;
 padding:20px 16px;position:relative;overflow:hidden;text-align:center;margin-bottom:12px;}
.pred::before{content:'';position:absolute;top:0;left:-110%;width:110%;height:100%;
 background:linear-gradient(100deg,transparent,rgba(0,157,255,.13),transparent);animation:sh 3s infinite;}
@keyframes sh{0%{left:-110%;}60%{left:110%;}100%{left:110%;}}
.pred .bdg{position:absolute;top:12px;right:12px;background:var(--green);font-size:9px;font-weight:900;
 padding:4px 10px;border-radius:12px;letter-spacing:1px;}
.pred .ttl{font-size:12px;color:#7fa8d4;letter-spacing:2px;font-weight:700;}
.pred .num{font-size:44px;font-weight:900;line-height:1.15;margin-top:8px;
 background:gradient gold white green;background:linear-gradient(135deg,var(--gold) 0%,#fff 50%,var(--green) 100%);
 -webkit-background-clip:text;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 0 20px rgba(255,213,79,.35));}
.pred .lbl{font-size:11px;color:#8ba4c8;margin-top:4px;}
.pred .row{display:flex;justify-content:center;gap:16px;margin-top:14px;}
.pred .st{text-align:center;}
.pred .st .v{font-size:16px,var(--green);}
.pred .st .v{font-size:16px;font-weight:900;color:var(--green);}
.pred .st .l{font-size:9px;color:#5a7096;letter-spacing:1px;margin-top:2px;}

.apples{display:flex;justify-content:center;gap:8px;margin:14px 0 6px;}
.app{width:44px;height:44px;border-radius:12px;background:linear-gradient(160deg,#142038,#0d1526);
 border:1px solid #22345a;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .3s;}
.app.win{border-color:var(--green);box-shadow:0 0 16px rgba(0,230,118,.4);transform:scale(1.08);}
.app.lose{opacity:.45;filter:grayscale(1);}

.albl{text-align:center;font-size:10px;color:#5a7096;letter-spacing:1px;margin-bottom:12px;}

.hist{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.hist h3{font-size:11px;color:#7fa8d4;letter-spacing:1.5px;font-weight:800;margin-bottom:10px;text-transform:uppercase;}
.hist .r{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #131f36;font-size:12px;}
.hist .r:last-child{border:none;}
.hist .r .who{flex:1;color:#c4d4ec;font-weight:600;}
.hist .r .amt{font-weight:800;color:var(--green);}
.hist .r .rl{width:52px;text-align:center;font-size:9px;font-weight:800;padding:3px 0;border-radius:8px;}
.hist .r .rl.w{background:rgba(0,230,118,.12);color:var(--green);}
.hist .r .rl.l{background:rgba(255,61,110,.12);color:var(--red);}

.tmr{background:rgba(0,157,255,.06);border:1px solid rgba(0,157,255,.2);border-radius:12px;
 padding:12px;text-align:center;margin-bottom:14px;}
.tmr .tl{font-size:10px;color:#7fc4ff;letter-spacing:1.5px;font-weight:700;margin-bottom:6px;}
.tmr .dg{display:flex;justify-content:center;gap:7px;}
.tmr .d{background:#0a1224;border:1px solid #1c2a44;border-radius:7px;padding:6px 12px;min-width:52px;}
.tmr .n{font-size:18px;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums;}
.tmr .l{font-size:7.5px;color:#4d6078;letter-spacing:1.5px;margin-top:2px;}

.cta{width:100%;padding:15px;border:none;border-radius:12px;margin-bottom:14px;
 background:linear-gradient(135deg,#009dff,#00e676);color:#04121f;font-size:15px;font-weight:900;
 letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
 box-shadow:0 4px 26px rgba(0,180,255,.35);transition:all .15s;}
.cta:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,200,255,.45);}
.cta:active{transform:translateY(0);}

.note{background:rgba(0,230,118,.05);border:1px solid rgba(0,230,118,.18);border-radius:10px;
 padding:10px 14px;font-size:10.5px;color:#8ba4c8;text-align:center;line-height:1.5;}
.note b{color:var(--green);}
</style>
</head>
<body>

<div class="bgfx"></div>

<div class="wrap">

<div class="hdr">
<div class="lg">🍎</div>
<div class="t">
<h1>Apple of <span>Fortune</span></h1>
<div class="s">PREDICTOR DEMO • SANS INSCRIPTION</div>
</div>
<span class="pct" id="pct">94.7%</span>
</div>

<div class="pred">
<span class="bdg">LIVE</span>
<div class="ttl">PRÉDICTION DU MOMENT</div>
<div class="num" id="pnum">🍎 POMME 3</div>
<div class="lbl">La pomme gagnante estimée de la prochaine manche</div>
<div class="row">
<div class="st"><div class="v" id="ppl">12 847</div><div class="l">UTILISATEURS</div></div>
<div class="st"><div class="v">x1.92</div><div class="l">GAIN MOYEN</div></div>
<div class="st"><div class="v" id="streak">5</div><div class="l">SÉRIE GAGNANTE</</div></div>
</div>

<div class="apples" id="apples">
<div class="app">🍎</div>
<div class="app">🍎</div>
<div class="app">🍎</div>
<div class="app">🍎</div>
<div class="app">🍎</div>
</div
